<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DON · 冬至快乐 | Cyber Winter Solstice</title><style>
:root{--cyan:#42f5ff;--purple:#a06bff;--orange:#ffb35a}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;color:#ecffff;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#030712}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.grid{position:fixed;inset:0;background:linear-gradient(transparent 97%,#23d9ff18 98%),linear-gradient(90deg,transparent 97%,#23d9ff18 98%);background-size:64px 64px;transform:perspective(700px) rotateX(64deg) scale(2);transform-origin:center 80%;opacity:.38;pointer-events:none}.glow{position:fixed;inset:-30%;background:radial-gradient(ellipse at 50% 55%,#126b9850,transparent 40%),radial-gradient(ellipse at 25% 25%,#6d2cc125,transparent 35%);pointer-events:none}.wrap{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 18px}.panel{width:min(580px,100%);text-align:center;position:relative;padding:30px 24px 35px;border:1px solid #54dfff65;border-radius:24px;background:linear-gradient(140deg,#071c32dc,#0a0a22e9 65%,#180b2ee5);box-shadow:0 0 40px #18cfff23,inset 0 0 35px #00d5ff12;backdrop-filter:blur(15px)}.panel:before,.panel:after{content:'';position:absolute;width:70px;height:70px;border:3px solid var(--cyan);pointer-events:none}.panel:before{left:-2px;top:-2px;border-right:0;border-bottom:0;border-radius:24px 0 0 0}.panel:after{right:-2px;bottom:-2px;border-left:0;border-top:0;border-radius:0 0 24px 0}.eyebrow{font:600 11px/1.8 ui-monospace,monospace;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 12px var(--cyan)}.avatar-ring{width:190px;height:190px;position:relative;margin:17px auto 20px;border-radius:50%;padding:7px;background:conic-gradient(from 0deg,var(--cyan),#1b4e91,var(--purple),var(--orange),var(--cyan));box-shadow:0 0 30px #36d9ff8c;animation:float 4s ease-in-out infinite}.avatar-ring:before{content:'';position:absolute;inset:-15px;border:1px dashed #49dfff99;border-radius:50%;animation:spin 18s linear infinite}.avatar-ring:after{content:'';position:absolute;inset:-25px;border:1px solid #49dfff30;border-radius:50%}.avatar-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid #061222;display:block}.tag{display:inline-block;border:1px solid #65e9ff66;background:#00e5ff12;color:#91f9ff;border-radius:100px;padding:6px 15px;font:12px ui-monospace,monospace;letter-spacing:2px}.headline{font-size:clamp(32px,8vw,54px);font-weight:900;letter-spacing:4px;margin:14px 0 8px;background:linear-gradient(100deg,#fff,#65f5ff 40%,#b39cff 75%,#fff);background-clip:text;color:transparent;filter:drop-shadow(0 0 12px #3ddfff55)}.headline span{color:#fff0b4;background:none}.sub{font-size:15px;letter-spacing:3px;color:#a9cbd7}.main-button{cursor:pointer;appearance:none;border:1px solid #78f7ff;background:linear-gradient(90deg,#065b76,#38339a);color:white;border-radius:12px;font-size:17px;font-weight:800;letter-spacing:3px;padding:15px 28px;margin-top:25px;box-shadow:0 0 24px #1dcdfb55;transition:transform .2s,box-shadow .2s}.main-button:hover{transform:translateY(-3px);box-shadow:0 0 35px #35efffaa}.hint{font-size:12px;color:#7b9db0;margin-top:15px;letter-spacing:1px}.dumpling{display:none;font-size:100px;line-height:1.2;filter:drop-shadow(0 0 25px #ffe5a6);animation:pop .8s cubic-bezier(.2,1.8,.3,1) both}.celebrate .dumpling{display:block}.celebrate .headline{font-size:clamp(28px,7vw,43px)}.celebrate .headline .before{display:none}.celebrate .headline .after{display:inline}.headline .after{display:none}.celebrate .sub{color:#ffe5ac}.scan{position:fixed;top:-5%;left:0;right:0;height:2px;background:#53f9ff75;box-shadow:0 0 30px #53f9ff;animation:scan 8s linear infinite;pointer-events:none;opacity:.5}.footer{margin-top:22px;color:#6d93aa;font:10px ui-monospace,monospace;letter-spacing:2px}.chip{position:absolute;width:8px;height:8px;border:1px solid #68f5ff;transform:rotate(45deg);box-shadow:0 0 9px #53f9ff}.chip.a{left:18px;top:18px}.chip.b{right:18px;top:18px}.burst{position:fixed;z-index:10;pointer-events:none;font-size:24px;animation:fly 1.8s ease-out forwards}@keyframes float{50%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.1) rotate(-25deg);opacity:0}70%{transform:scale(1.18) rotate(7deg)}100%{transform:scale(1);opacity:1}}@keyframes fly{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1.3);opacity:0}}@keyframes scan{to{top:105%}}@media(max-height:750px){.panel{padding:16px}.avatar-ring{width:130px;height:130px;margin:10px auto}.headline{margin:8px 0}.main-button{margin-top:12px}.footer{margin-top:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important}}

}
@media(max-width:380px){.panel{padding:13px 12px 17px}.avatar-ring{width:112px;height:112px;margin:12px auto}.headline{margin:9px 0 5px}.main-button{margin-top:12px}.footer{margin-top:11px}}
@media(max-height:680px) and (orientation:portrait){.wrap{align-items:flex-start}.panel{margin:auto 0}.avatar-ring{width:105px;height:105px;margin:9px auto 10px}.panel{padding-top:12px;padding-bottom:13px}.headline{margin:8px 0 5px}.main-button{margin-top:10px}.hint{margin-top:8px}.footer{margin-top:9px}}

const c=document.getElementById('stars'),ctx=c.getContext('2d');let W,H,stars=[];function resize(){W=c.width=innerWidth;H=c.height=innerHeight;stars=Array.from({length:Math.min(innerWidth<650?65:130,Math.floor(W*H/8500))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.3,v:Math.random()*.6+.2,a:Math.random()}))}addEventListener('resize',resize);resize();function tick(){ctx.clearRect(0,0,W,H);for(const s of stars){s.y+=s.v;if(s.y>H)s.y=-5;ctx.beginPath();ctx.fillStyle=`rgba(117,231,255,${.2+.65*Math.abs(Math.sin(Date.now()/1100+s.a*10))})`;ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(tick)}tick();let on=false;document.getElementById('trigger').onclick=()=>{on=!on;document.getElementById('panel').classList.toggle('celebrate',on);document.getElementById('trigger').textContent=on?'↻ 再变一次':'✦ 点击启动饺子程序 ✦';document.getElementById('hint').textContent=on?'🥟 饺子已生成 · 温暖加载完成 100%':'点击按钮，解锁冬至惊喜 · CLICK TO TRANSFORM';document.getElementById('wish').textContent=on?'DON 祝你冬至快乐 · 好运与温暖常伴':'DON 祝你冬至快乐';if(on){for(let i=0;i<(innerWidth<650?26:48);i++){const el=document.createElement('span');el.className='burst';el.textContent=['🥟','✦','❄','✧','⚡'][Math.floor(Math.random()*5)];el.style.left='50%';el.style.top='52%';el.style.setProperty('--x',`${(Math.random()-.5)*innerWidth*.9}px`);el.style.setProperty('--y',`${(Math.random()-.5)*innerHeight*.9}px`);el.style.setProperty('--r',`${Math.random()*720-360}deg`);el.style.animationDelay=`${Math.random()*.35}s`;document.body.append(el);setTimeout(()=>el.remove(),2300)}}};
